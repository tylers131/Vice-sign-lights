<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Vice Sign</title>
<!-- Empty data URI: stops the browser asking for /favicon.ico and logging a
     404 on every kiosk launch. Nothing shows the icon anyway -- there is no
     tab bar in kiosk mode. -->
<link rel="icon" href="data:,">
<style>
/* Inline on purpose: the AP has no uplink, so no CDN and no webfont.
   Sized for a 480x320 SPI panel at minimum and comfortable at 800x480. */
:root{
  --bg:#0b0d12; --panel:#161a23; --panel2:#1e2431; --line:#2b3342;
  --ink:#e8ecf4; --muted:#8b96ad; --accent:#ff2d78; --accent2:#22d3ee;
  --ok:#25c06a; --warn:#f5a524; --bad:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* A kiosk has no mouse and no keyboard. Kill every affordance that implies one:
   the cursor, text selection, the long-press callout, and double-tap zoom. */
body{cursor:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%}

/* ------------------------------------------------------------- status bar */
#bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 10px;
  background:linear-gradient(180deg,#141824,#10131b);border-bottom:1px solid var(--line)}
#bar .brand{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
#bar .brand span{color:var(--accent)}
#now{flex:1 1 auto;min-width:0;font-size:14px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now b{color:var(--accent2);font-weight:600}
#health{flex:0 0 auto;font-size:12px;color:var(--muted);white-space:nowrap}
#health .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--ok);margin-right:5px;vertical-align:1px}
#health.warn .dot{background:var(--warn)} #health.bad .dot{background:var(--bad)}

/* -------------------------------------------------------------- progress */
/* A sweep takes ~30s. Without this the sign looks broken and people keep
   tapping, which just queues more work. */
#prog{flex:0 0 auto;height:0;overflow:hidden;transition:height .18s ease;
  background:var(--panel);border-bottom:1px solid var(--line)}
#prog.on{height:38px}
#progInner{padding:6px 10px}
#progText{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
#track{height:6px;border-radius:3px;background:var(--panel2);margin-top:5px;overflow:hidden}
#fill{height:100%;width:0;border-radius:3px;transition:width .3s ease;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ---------------------------------------------------------------- scenes */
#scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 10px}
#scroll::-webkit-scrollbar{width:0}
.head{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  font-weight:700;margin:10px 0 6px}
.head:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px}
.scene{min-height:66px;padding:8px 6px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:15px;font-weight:600;line-height:1.15;
  display:flex;align-items:center;justify-content:center;text-align:center;
  transition:transform .08s ease,background .15s ease,border-color .15s ease}
.scene:active{transform:scale(.95);background:var(--panel2)}
.scene.playing{border-color:var(--accent);background:#241726;color:#fff}
/* Tapped but not yet confirmed by the server -- the sign takes seconds to
   respond, so the button has to acknowledge the touch immediately. */
.scene.pending{border-color:var(--accent2);background:#152430;
  animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* ------------------------------------------------------------ action bar */
#actions{flex:0 0 auto;display:flex;gap:7px;padding:8px 10px;
  background:linear-gradient(0deg,#141824,#10131b);border-top:1px solid var(--line);
  padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.act{flex:1 1 0;min-height:56px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:15px;font-weight:700;
  letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;transition:transform .08s ease}
.act:active{transform:scale(.95)}
.act small{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.act.off{border-color:#4a2230;background:#2a1520;color:#ffb4c6}
.act.on small{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(14px);
  background:#000d;border:1px solid var(--line);border-radius:9px;padding:8px 14px;
  font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="brand">VI<span>C</span>E</div>
    <div id="now">Loading&hellip;</div>
    <div id="health"><span class="dot"></span><span id="healthText">&mdash;</span></div>
  </div>

  <div id="prog"><div id="progInner">
    <div id="progText"><span id="progWhat">Working</span><span id="progCount"></span></div>
    <div id="track"><div id="fill"></div></div>
  </div></div>

  <div id="scroll"><div id="scenes"></div></div>

  <div id="actions">
    <button class="act off" id="btnOff">OFF<small>all lights</small></button>
    <button class="act" id="btnNext">NEXT<small>new scene</small></button>
    <button class="act" id="btnRot">ROTATE<small id="rotState">&mdash;</small></button>
  </div>
</div>
<div id="toast"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var STATE = {scenes:[], modes:[], playing:"", rotation:{}};
var pendingScene = null, pendingSince = 0, timer = null;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,
  function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]; }); }
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("on"); },2400);
}
function post(url, body){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
                    body:JSON.stringify(body||{})})
    .then(function(r){ return r.json(); })
    .catch(function(){ return {ok:false,error:"no answer from the sign"}; });
}

/* Same split as the Scenes tab: a scene animates if any step runs a mode that
   moves. Derived from the mode catalogue so a renamed mode re-sorts itself. */
function splitScenes(){
  var moving={};
  (STATE.modes||[]).forEach(function(m){ if(m.animates) moving[m.value]=true; });
  var animated=[], solid=[];
  (STATE.scenes||[]).forEach(function(s){
    var moves=(s.steps||[]).some(function(st){ return st.mode && moving[st.mode]; });
    (moves?animated:solid).push(s);
  });
  return [["Animated", animated], ["Solid", solid]];
}
function renderScenes(){
  var html = splitScenes().filter(function(p){ return p[1].length; }).map(function(pair){
    return '<div class="head">'+pair[0]+'</div><div class="grid">'
      + pair[1].map(function(s){
          return '<button class="scene" data-scene="'+esc(s.name)+'">'+esc(s.name)+'</button>';
        }).join("") + '</div>';
  }).join("");
  $("scenes").innerHTML = html || '<div class="head">No scenes saved</div>';
  markScenes();
}
function markScenes(){
  var buttons = document.querySelectorAll(".scene");
  for (var i=0;i<buttons.length;i++){
    var b = buttons[i], name = b.dataset.scene;
    b.classList.toggle("pending", name === pendingScene);
    b.classList.toggle("playing", name !== pendingScene && name === STATE.playing);
  }
}

function applyScene(name){
  pendingScene = name; pendingSince = Date.now(); markScenes();
  post("/api/scene/apply",{scene:name}).then(function(j){
    if(!j.ok){ pendingScene=null; markScenes(); toast(j.error||"could not apply"); }
    else { poll(); }
  });
}

function renderProgress(status){
  var job = null, jobs = status.jobs || [];
  for (var i=0;i<jobs.length;i++){
    if (jobs[i].state === "running" || jobs[i].state === "queued"){ job = jobs[i]; break; }
  }
  if (!job && !status.busy){ $("prog").classList.remove("on"); return; }
  var items = (job && job.items) || [];
  var done = items.filter(function(it){ return it.status && it.status !== "pending"; }).length;
  var total = items.length || 1;
  $("prog").classList.add("on");
  $("progWhat").textContent = (job && job.label) ? job.label.replace(/^scene:\s*/,"Applying ") : "Working";
  $("progCount").textContent = done + " of " + total
    + (status.queued ? "  (+" + status.queued + " queued)" : "");
  $("fill").style.width = Math.round(done/total*100) + "%";
}

function renderHealth(status){
  var devices = status.devices || {}, names = Object.keys(devices);
  var bad = names.filter(function(a){ return devices[a].reachable === false; }).length;
  var el = $("health");
  el.className = bad === 0 ? "" : (bad > 2 ? "bad" : "warn");
  $("healthText").textContent = bad === 0 ? (names.length + " lit") : (bad + " down");
}

function renderRotation(rot){
  STATE.rotation = rot || {};
  var on = !!(rot && rot.enabled);
  $("btnRot").classList.toggle("on", on);
  if (!on){ $("rotState").textContent = "off"; return; }
  if (rot.holding){ $("rotState").textContent = "held " + Math.ceil(rot.hold_remaining_seconds/60) + "m"; return; }
  if (rot.next_in_seconds == null){ $("rotState").textContent = "on"; return; }
  var s = Math.max(0, Math.round(rot.next_in_seconds));
  $("rotState").textContent = s >= 60 ? ("next " + Math.ceil(s/60) + "m") : ("next " + s + "s");
}

function poll(){
  fetch("/api/status").then(function(r){ return r.json(); }).then(function(s){
    if (!s.ok) return;
    var rot = s.rotation || {};
    STATE.playing = rot.current || STATE.playing;
    $("now").innerHTML = STATE.playing ? ("Now playing <b>"+esc(STATE.playing)+"</b>") : "Ready";
    renderProgress(s); renderHealth(s); renderRotation(rot);
    // Clear the tapped state once the sign has actually taken the job, or after
    // 45s if it never does -- a stuck highlight is worse than none.
    if (pendingScene && (STATE.playing === pendingScene || Date.now()-pendingSince > 45000)){
      pendingScene = null;
    }
    markScenes();
    schedule(s.busy || s.queued ? 1200 : 4000);
  }).catch(function(){ schedule(5000); });
}
function schedule(ms){ clearTimeout(timer); timer = setTimeout(poll, ms); }

function loadState(){
  fetch("/api/state").then(function(r){ return r.json(); }).then(function(j){
    if(!j.ok) return;
    STATE.scenes = j.scenes || []; STATE.modes = j.modes || [];
    renderScenes(); poll();
  }).catch(function(){ setTimeout(loadState, 4000); });
}

$("scenes").addEventListener("click", function(e){
  var b = e.target.closest(".scene");
  if (b) applyScene(b.dataset.scene);
});
$("btnOff").addEventListener("click", function(){
  pendingScene = null; markScenes();
  post("/api/power",{target:"all", on:false}).then(function(j){
    toast(j.ok ? "Turning everything off" : (j.error||"could not turn off")); poll(); });
});
$("btnNext").addEventListener("click", function(){
  post("/api/rotation/next",{}).then(function(j){
    toast(j.ok ? ("Now playing " + j.scene) : (j.error||"nothing to play")); poll(); });
});
$("btnRot").addEventListener("click", function(){
  var want = !(STATE.rotation && STATE.rotation.enabled);
  post("/api/rotation",{enabled:want}).then(function(j){
    if (j.ok){ renderRotation(j.rotation); toast(want ? "Rotation on" : "Rotation off"); }
    poll();
  });
});
// A stray two-finger pinch should not leave the kiosk zoomed with no way back.
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

loadState();
// The sign outlives any one page load; if the service restarts, recover.
setInterval(function(){ if (!STATE.scenes.length) loadState(); }, 15000);
</script>
</body>
</html>
